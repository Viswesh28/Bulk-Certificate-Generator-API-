<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="1100" height="620" font-family="Georgia, 'Palatino Linotype', serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c1a16"/>
    </marker>
    <marker id="arrDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#716a5c"/>
    </marker>
  </defs>

  <rect width="1100" height="620" fill="#f4f0e6"/>
  <line x1="40" y1="34" x2="1060" y2="34" stroke="#1c1a16" stroke-width="3"/>
  <text x="40" y="62" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.5" fill="#716a5c">ARCHITECTURE</text>
  <text x="40" y="100" font-size="32" fill="#1c1a16">Certificate Register: request and processing flow</text>

  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.2" fill="#716a5c">
    <text x="90" y="150">CLIENT</text>
    <text x="370" y="150">HTTP LAYER</text>
    <text x="650" y="150">PROCESSING</text>
    <text x="920" y="150">PERSISTENCE</text>
  </g>

  <!-- boxes -->
  <rect x="50" y="170" width="200" height="110" fill="none" stroke="#1c1a16" stroke-width="1.5"/>
  <text x="150" y="208" text-anchor="middle" font-size="19" fill="#1c1a16">Browser / CLI</text>
  <text x="150" y="232" text-anchor="middle" font-size="13" font-style="italic" fill="#716a5c">register UI, submit_csv.py</text>

  <rect x="330" y="170" width="230" height="110" fill="none" stroke="#1c1a16" stroke-width="1.5"/>
  <text x="445" y="208" text-anchor="middle" font-size="19" fill="#1c1a16">FastAPI routes</text>
  <text x="445" y="232" text-anchor="middle" font-size="13" font-style="italic" fill="#716a5c">Pydantic validation, 202 / 404 / 409</text>

  <rect x="630" y="330" width="230" height="110" fill="none" stroke="#1c1a16" stroke-width="1.5"/>
  <text x="745" y="368" text-anchor="middle" font-size="19" fill="#1c1a16">Worker pool</text>
  <text x="745" y="392" text-anchor="middle" font-size="13" font-style="italic" fill="#716a5c">asyncio queue, N coroutines</text>

  <rect x="630" y="470" width="230" height="110" fill="none" stroke="#1c1a16" stroke-width="1.5"/>
  <text x="745" y="508" text-anchor="middle" font-size="19" fill="#1c1a16">Engine: process_job</text>
  <text x="745" y="532" text-anchor="middle" font-size="13" font-style="italic" fill="#716a5c">per-recipient try/except</text>

  <rect x="900" y="170" width="170" height="110" fill="none" stroke="#1c1a16" stroke-width="1.5"/>
  <text x="985" y="208" text-anchor="middle" font-size="19" fill="#1c1a16">Relational DB</text>
  <text x="985" y="232" text-anchor="middle" font-size="13" font-style="italic" fill="#716a5c">jobs, recipients</text>

  <rect x="900" y="470" width="170" height="110" fill="none" stroke="#1c1a16" stroke-width="1.5"/>
  <text x="985" y="508" text-anchor="middle" font-size="19" fill="#1c1a16">PDF storage</text>
  <text x="985" y="532" text-anchor="middle" font-size="13" font-style="italic" fill="#716a5c">&lt;job&gt;/&lt;recipient&gt;.pdf</text>

  <!-- write path (solid) -->
  <path d="M250,195 L330,195" stroke="#1c1a16" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="290" y="186" text-anchor="middle" font-size="12" fill="#716a5c">POST batch</text>

  <path d="M560,195 L900,195" stroke="#1c1a16" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="730" y="186" text-anchor="middle" font-size="12" fill="#716a5c">one transaction: job + rows</text>

  <path d="M445,280 L445,305 L700,305 L700,330" stroke="#1c1a16" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  <text x="560" y="298" text-anchor="middle" font-size="12" fill="#716a5c">submit(job_id), then 202</text>

  <path d="M745,440 L745,470" stroke="#1c1a16" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="757" y="459" font-size="12" fill="#716a5c">to_thread</text>

  <path d="M860,520 L900,520" stroke="#1c1a16" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="880" y="512" text-anchor="middle" font-size="11" fill="#716a5c">save</text>

  <path d="M860,490 L872,490 L872,235 L900,235" stroke="#1c1a16" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  <text x="868" y="400" font-size="12" fill="#716a5c" transform="rotate(-90 868 400)">status, counters</text>

  <!-- read path (dashed) -->
  <path d="M900,260 L560,260" stroke="#716a5c" stroke-width="1.3" stroke-dasharray="5 4" fill="none" marker-end="url(#arrDash)"/>
  <text x="730" y="278" text-anchor="middle" font-size="12" fill="#716a5c">read job, recipients</text>

  <path d="M330,245 L250,245" stroke="#716a5c" stroke-width="1.3" stroke-dasharray="5 4" fill="none" marker-end="url(#arrDash)"/>
  <text x="290" y="236" text-anchor="middle" font-size="11" fill="#716a5c">status,</text>
  <text x="290" y="252" text-anchor="middle" font-size="11" fill="#716a5c">PDF, ZIP</text>


  <line x1="40" y1="600" x2="1060" y2="600" stroke="#1c1a16" stroke-width="1"/>
  <text x="40" y="614" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#716a5c">Solid lines: write path. Dashed lines: read path (status polling, certificate download).</text>
</svg>
